<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NEURO-LINK // Webhook Transmitter</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Orbitron:wght@400;700;900&display=swap');

        :root {
            --neon-cyan: #00f0ff;
            --neon-magenta: #ff00ff;
            --neon-purple: #b026ff;
            --neon-green: #00ff88;
            --dark-bg: #050510;
            --panel-bg: rgba(5, 5, 16, 0.85);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: var(--dark-bg);
            color: var(--neon-cyan);
            font-family: 'Share Tech Mono', monospace;
            overflow: hidden;
            min-height: 100vh;
        }

        #canvas-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
        }

        /* Scanlines overlay */
        .scanlines {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: repeating-linear-gradient(
                0deg,
                rgba(0, 0, 0, 0.15),
                rgba(0, 0, 0, 0.15) 1px,
                transparent 1px,
                transparent 2px
            );
            pointer-events: none;
            z-index: 1;
        }

        /* CRT flicker */
        .crt-flicker {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 255, 200, 0.02);
            pointer-events: none;
            z-index: 2;
            animation: flicker 0.15s infinite;
        }

        @keyframes flicker {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.97; }
        }

        /* Main UI */
        .main-container {
            position: relative;
            z-index: 10;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
        }

        .header h1 {
            font-family: 'Orbitron', sans-serif;
            font-size: 3rem;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 8px;
            background: linear-gradient(90deg, var(--neon-cyan), var(--neon-magenta), var(--neon-purple));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            text-shadow: 0 0 30px rgba(0, 240, 255, 0.5);
            animation: glitchText 3s infinite;
        }

        .header .subtitle {
            font-size: 0.9rem;
            color: var(--neon-magenta);
            letter-spacing: 6px;
            margin-top: 8px;
            opacity: 0.8;
        }

        @keyframes glitchText {
            0%, 90%, 100% { transform: translate(0); }
            91% { transform: translate(-2px, 1px); }
            92% { transform: translate(2px, -1px); }
            93% { transform: translate(0); }
        }

        /* Panel */
        .panel {
            background: var(--panel-bg);
            border: 1px solid rgba(0, 240, 255, 0.3);
            border-radius: 4px;
            padding: 30px;
            width: 100%;
            max-width: 600px;
            backdrop-filter: blur(10px);
            box-shadow: 
                0 0 20px rgba(0, 240, 255, 0.1),
                inset 0 0 20px rgba(0, 240, 255, 0.05);
            position: relative;
        }

        .panel::before {
            content: '';
            position: absolute;
            top: -1px;
            left: -1px;
            right: -1px;
            height: 2px;
            background: linear-gradient(90deg, var(--neon-cyan), var(--neon-magenta), var(--neon-purple));
            animation: borderGlow 2s ease-in-out infinite alternate;
        }

        @keyframes borderGlow {
            0% { opacity: 0.5; }
            100% { opacity: 1; }
        }

        .panel-header {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 25px;
            padding-bottom: 15px;
            border-bottom: 1px solid rgba(0, 240, 255, 0.2);
        }

        .panel-header .status-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: var(--neon-green);
            box-shadow: 0 0 10px var(--neon-green);
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.4; }
        }

        .panel-header span {
            font-size: 0.85rem;
            color: var(--neon-green);
            letter-spacing: 2px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            font-size: 0.8rem;
            color: var(--neon-cyan);
            margin-bottom: 8px;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        .form-group input[type="text"],
        .form-group textarea {
            width: 100%;
            background: rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(0, 240, 255, 0.3);
            border-radius: 3px;
            padding: 12px 15px;
            color: var(--neon-cyan);
            font-family: 'Share Tech Mono', monospace;
            font-size: 0.9rem;
            outline: none;
            transition: all 0.3s;
        }

        .form-group input[type="text"]:focus,
        .form-group textarea:focus {
            border-color: var(--neon-cyan);
            box-shadow: 0 0 15px rgba(0, 240, 255, 0.2);
        }

        .form-group input::placeholder,
        .form-group textarea::placeholder {
            color: rgba(0, 240, 255, 0.3);
        }

        .form-group textarea {
            min-height: 100px;
            resize: vertical;
        }

        /* File upload */
        .file-drop-zone {
            border: 2px dashed rgba(0, 240, 255, 0.3);
            border-radius: 4px;
            padding: 30px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s;
            position: relative;
            overflow: hidden;
        }

        .file-drop-zone:hover,
        .file-drop-zone.dragover {
            border-color: var(--neon-magenta);
            background: rgba(255, 0, 255, 0.05);
            box-shadow: 0 0 20px rgba(255, 0, 255, 0.1);
        }

        .file-drop-zone input[type="file"] {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            opacity: 0;
            cursor: pointer;
        }

        .file-drop-zone .file-icon {
            font-size: 2rem;
            margin-bottom: 10px;
            color: var(--neon-magenta);
        }

        .file-drop-zone .file-text {
            font-size: 0.85rem;
            color: rgba(0, 240, 255, 0.6);
        }

        .file-drop-zone .file-name {
            font-size: 0.85rem;
            color: var(--neon-green);
            margin-top: 8px;
            word-break: break-all;
        }

        /* Buttons */
        .btn-group {
            display: flex;
            gap: 15px;
            margin-top: 25px;
        }

        .btn {
            flex: 1;
            padding: 14px 24px;
            border: 1px solid;
            border-radius: 3px;
            font-family: 'Orbitron', sans-serif;
            font-size: 0.85rem;
            font-weight: 700;
            letter-spacing: 3px;
            text-transform: uppercase;
            cursor: pointer;
            transition: all 0.3s;
            position: relative;
            overflow: hidden;
        }

        .btn-primary {
            background: linear-gradient(135deg, rgba(0, 240, 255, 0.15), rgba(176, 38, 255, 0.15));
            border-color: var(--neon-cyan);
            color: var(--neon-cyan);
        }

        .btn-primary:hover {
            background: linear-gradient(135deg, rgba(0, 240, 255, 0.3), rgba(176, 38, 255, 0.3));
            box-shadow: 0 0 30px rgba(0, 240, 255, 0.3);
            transform: translateY(-2px);
        }

        .btn-secondary {
            background: transparent;
            border-color: var(--neon-magenta);
            color: var(--neon-magenta);
        }

        .btn-secondary:hover {
            background: rgba(255, 0, 255, 0.1);
            box-shadow: 0 0 30px rgba(255, 0, 255, 0.2);
        }

        .btn:disabled {
            opacity: 0.4;
            cursor: not-allowed;
            transform: none !important;
        }

        /* Response area */
        .response-area {
            margin-top: 20px;
            padding: 15px;
            border-radius: 3px;
            font-size: 0.85rem;
            display: none;
            animation: slideIn 0.3s ease;
        }

        @keyframes slideIn {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .response-area.success {
            display: block;
            background: rgba(0, 255, 136, 0.1);
            border: 1px solid var(--neon-green);
            color: var(--neon-green);
        }

        .response-area.error {
            display: block;
            background: rgba(255, 0, 80, 0.1);
            border: 1px solid #ff0050;
            color: #ff0050;
        }

        .response-area.info {
            display: block;
            background: rgba(0, 240, 255, 0.1);
            border: 1px solid var(--neon-cyan);
            color: var(--neon-cyan);
        }

        /* Corner decorations */
        .corner {
            position: absolute;
            width: 20px;
            height: 20px;
            border: 2px solid var(--neon-cyan);
        }

        .corner-tl { top: -2px; left: -2px; border-right: none; border-bottom: none; }
        .corner-tr { top: -2px; right: -2px; border-left: none; border-bottom: none; }
        .corner-bl { bottom: -2px; left: -2px; border-right: none; border-top: none; }
        .corner-br { bottom: -2px; right: -2px; border-left: none; border-top: none; }

        /* Footer */
        .footer {
            margin-top: 20px;
            text-align: center;
            font-size: 0.7rem;
            color: rgba(0, 240, 255, 0.3);
            letter-spacing: 3px;
        }

        /* Loading spinner */
        .spinner {
            display: inline-block;
            width: 16px;
            height: 16px;
            border: 2px solid rgba(0, 240, 255, 0.3);
            border-top-color: var(--neon-cyan);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin-right: 8px;
            vertical-align: middle;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* Audio preview */
        .audio-preview {
            margin-top: 15px;
            display: none;
        }

        .audio-preview audio {
            width: 100%;
            filter: hue-rotate(180deg) saturate(2);
        }

        /* Responsive */
        @media (max-width: 600px) {
            .header h1 { font-size: 1.8rem; letter-spacing: 4px; }
            .panel { padding: 20px; }
            .btn-group { flex-direction: column; }
        }
    </style>
</head>
<body>
    <div id="canvas-container"></div>
    <div class="scanlines"></div>
    <div class="crt-flicker"></div>

    <div class="main-container">
        <div class="header">
            <h1>NEURO-LINK</h1>
            <div class="subtitle">/// WEBHOOK TRANSMISSION PROTOCOL ///</div>
        </div>

        <div class="panel">
            <div class="corner corner-tl"></div>
            <div class="corner corner-tr"></div>
            <div class="corner corner-bl"></div>
            <div class="corner corner-br"></div>

            <div class="panel-header">
                <div class="status-dot"></div>
                <span>SYSTEM ONLINE // READY TO TRANSMIT</span>
            </div>

            <div class="form-group">
                <label>Target Webhook URL</label>
                <input type="text" id="webhookUrl" placeholder="https://hooks.example.com/endpoint/..." autocomplete="off">
            </div>

            <div class="form-group">
                <label>Transmission Payload</label>
                <textarea id="messageText" placeholder="Enter your message payload here..."></textarea>
            </div>

            <div class="form-group">
                <label>Audio Attachment</label>
                <div class="file-drop-zone" id="dropZone">
                    <input type="file" id="audioFile" accept="audio/*">
                    <div class="file-icon">&#9836;</div>
                    <div class="file-text" id="dropText">DROP AUDIO FILE OR CLICK TO BROWSE</div>
                    <div class="file-name" id="fileName"></div>
                </div>
                <div class="audio-preview" id="audioPreview">
                    <audio controls id="audioPlayer"></audio>
                </div>
            </div>

            <div class="btn-group">
                <button class="btn btn-secondary" id="clearBtn">CLEAR</button>
                <button class="btn btn-primary" id="sendBtn">TRANSMIT</button>
            </div>

            <div class="response-area" id="responseArea"></div>
        </div>

        <div class="footer">
            NEURO-LINK v2.0.7 // ALL TRANSMISSIONS ENCRYPTED IN TRANSIT
        </div>
    </div>

    <script>
        // ==================== THREE.JS BACKGROUND ====================
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        scene.fog = new THREE.FogExp2(0x050510, 0.0015);

        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 2000);
        camera.position.set(0, 15, 40);
        camera.lookAt(0, 0, 0);

        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        container.appendChild(renderer.domElement);

        // Grid floor
        const gridHelper = new THREE.GridHelper(200, 100, 0x00f0ff, 0x1a1a3a);
        gridHelper.position.y = -10;
        scene.add(gridHelper);

        // Moving grid lines effect
        const gridMaterial = new THREE.LineBasicMaterial({ 
            color: 0x00f0ff, 
            transparent: true, 
            opacity: 0.15 
        });

        // Particles
        const particlesGeometry = new THREE.BufferGeometry();
        const particleCount = 2000;
        const posArray = new Float32Array(particleCount * 3);
        const colorArray = new Float32Array(particleCount * 3);

        for (let i = 0; i < particleCount * 3; i += 3) {
            posArray[i] = (Math.random() - 0.5) * 200;
            posArray[i + 1] = (Math.random() - 0.5) * 100;
            posArray[i + 2] = (Math.random() - 0.5) * 200;

            const colorChoice = Math.random();
            if (colorChoice < 0.33) {
                colorArray[i] = 0; colorArray[i+1] = 0.94; colorArray[i+2] = 1; // cyan
            } else if (colorChoice < 0.66) {
                colorArray[i] = 1; colorArray[i+1] = 0; colorArray[i+2] = 1; // magenta
            } else {
                colorArray[i] = 0.69; colorArray[i+1] = 0.15; colorArray[i+2] = 1; // purple
            }
        }

        particlesGeometry.setAttribute('position', new THREE.BufferAttribute(posArray, 3));
        particlesGeometry.setAttribute('color', new THREE.BufferAttribute(colorArray, 3));

        const particlesMaterial = new THREE.PointsMaterial({
            size: 0.5,
            vertexColors: true,
            transparent: true,
            opacity: 0.8,
            blending: THREE.AdditiveBlending
        });

        const particles = new THREE.Points(particlesGeometry, particlesMaterial);
        scene.add(particles);

        // Floating geometric shapes
        const shapes = [];
        const shapeColors = [0x00f0ff, 0xff00ff, 0xb026ff];

        for (let i = 0; i < 15; i++) {
            const geoType = Math.floor(Math.random() * 3);
            let geometry;
            if (geoType === 0) geometry = new THREE.IcosahedronGeometry(Math.random() * 2 + 0.5, 0);
            else if (geoType === 1) geometry = new THREE.OctahedronGeometry(Math.random() * 2 + 0.5, 0);
            else geometry = new THREE.TetrahedronGeometry(Math.random() * 2 + 0.5, 0);

            const material = new THREE.MeshBasicMaterial({
                color: shapeColors[Math.floor(Math.random() * shapeColors.length)],
                wireframe: true,
                transparent: true,
                opacity: 0.4
            });

            const mesh = new THREE.Mesh(geometry, material);
            mesh.position.set(
                (Math.random() - 0.5) * 100,
                (Math.random() - 0.5) * 50 + 10,
                (Math.random() - 0.5) * 100
            );
            mesh.userData = {
                rotSpeed: { x: Math.random() * 0.02, y: Math.random() * 0.02 },
                floatSpeed: Math.random() * 0.01 + 0.005,
                floatOffset: Math.random() * Math.PI * 2
            };
            shapes.push(mesh);
            scene.add(mesh);
        }

        // Light beams
        const beamGeometry = new THREE.CylinderGeometry(0.1, 2, 60, 8, 1, true);
        const beamMaterial = new THREE.MeshBasicMaterial({
            color: 0x00f0ff,
            transparent: true,
            opacity: 0.03,
            side: THREE.DoubleSide,
            blending: THREE.AdditiveBlending
        });

        for (let i = 0; i < 5; i++) {
            const beam = new THREE.Mesh(beamGeometry, beamMaterial.clone());
            beam.position.set((Math.random() - 0.5) * 80, 20, (Math.random() - 0.5) * 80);
            beam.rotation.x = Math.random() * 0.3;
            beam.rotation.z = Math.random() * 0.3;
            beam.userData = { pulseSpeed: Math.random() * 0.02 + 0.01, pulseOffset: Math.random() * Math.PI * 2 };
            scene.add(beam);
            shapes.push(beam);
        }

        // Animation loop
        let time = 0;
        function animate() {
            requestAnimationFrame(animate);
            time += 0.01;

            // Rotate particles
            particles.rotation.y = time * 0.05;

            // Animate shapes
            shapes.forEach(shape => {
                if (shape.geometry.type !== 'CylinderGeometry') {
                    shape.rotation.x += shape.userData.rotSpeed.x;
                    shape.rotation.y += shape.userData.rotSpeed.y;
                    shape.position.y += Math.sin(time + shape.userData.floatOffset) * shape.userData.floatSpeed;
                } else {
                    shape.material.opacity = 0.02 + Math.sin(time * 2 + shape.userData.pulseOffset) * 0.02;
                }
            });

            // Move grid
            gridHelper.position.z = (time * 2) % 2;

            renderer.render(scene, camera);
        }
        animate();

        // Resize handler
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        // ==================== WEBHOOK FUNCTIONALITY ====================
        const webhookUrl = document.getElementById('webhookUrl');
        const messageText = document.getElementById('messageText');
        const audioFile = document.getElementById('audioFile');
        const dropZone = document.getElementById('dropZone');
        const dropText = document.getElementById('dropText');
        const fileName = document.getElementById('fileName');
        const audioPreview = document.getElementById('audioPreview');
        const audioPlayer = document.getElementById('audioPlayer');
        const sendBtn = document.getElementById('sendBtn');
        const clearBtn = document.getElementById('clearBtn');
        const responseArea = document.getElementById('responseArea');

        let selectedFile = null;

        // File handling
        dropZone.addEventListener('dragover', (e) => {
            e.preventDefault();
            dropZone.classList.add('dragover');
        });

        dropZone.addEventListener('dragleave', () => {
            dropZone.classList.remove('dragover');
        });

        dropZone.addEventListener('drop', (e) => {
            e.preventDefault();
            dropZone.classList.remove('dragover');
            const files = e.dataTransfer.files;
            if (files.length > 0) handleFile(files[0]);
        });

        audioFile.addEventListener('change', (e) => {
            if (e.target.files.length > 0) handleFile(e.target.files[0]);
        });

        function handleFile(file) {
            if (!file.type.startsWith('audio/')) {
                showResponse('Please select an audio file.', 'error');
                return;
            }
            selectedFile = file;
            dropText.textContent = 'FILE LOADED';
            fileName.textContent = file.name + ' (' + formatBytes(file.size) + ')';

            const url = URL.createObjectURL(file);
            audioPlayer.src = url;
            audioPreview.style.display = 'block';
        }

        function formatBytes(bytes) {
            if (bytes === 0) return '0 B';
            const k = 1024;
            const sizes = ['B', 'KB', 'MB', 'GB'];
            const i = Math.floor(Math.log(bytes) / Math.log(k));
            return parseFloat((bytes / Math.pow(k, i)).toFixed(2)) + ' ' + sizes[i];
        }

        function showResponse(msg, type) {
            responseArea.className = 'response-area ' + type;
            responseArea.innerHTML = msg;
        }

        // Clear
        clearBtn.addEventListener('click', () => {
            webhookUrl.value = '';
            messageText.value = '';
            audioFile.value = '';
            selectedFile = null;
            dropText.textContent = 'DROP AUDIO FILE OR CLICK TO BROWSE';
            fileName.textContent = '';
            audioPreview.style.display = 'none';
            audioPlayer.src = '';
            responseArea.className = 'response-area';
            responseArea.innerHTML = '';
        });

        // Send
        sendBtn.addEventListener('click', async () => {
            const url = webhookUrl.value.trim();
            const text = messageText.value.trim();

            if (!url) {
                showResponse('ERROR: Webhook URL required', 'error');
                return;
            }

            if (!text && !selectedFile) {
                showResponse('ERROR: Message or audio file required', 'error');
                return;
            }

            sendBtn.disabled = true;
            const originalText = sendBtn.innerHTML;
            sendBtn.innerHTML = '<span class="spinner"></span>TRANSMITTING...';

            try {
                let response;

                if (selectedFile) {
                    // Send as multipart/form-data with file
                    const formData = new FormData();
                    formData.append('file', selectedFile);
                    if (text) formData.append('content', text);
                    formData.append('payload_json', JSON.stringify({ content: text || 'Audio transmission' }));

                    response = await fetch(url, {
                        method: 'POST',
                        body: formData
                    });
                } else {
                    // Send as JSON
                    const payload = { content: text };
                    response = await fetch(url, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(payload)
                    });
                }

                if (response.ok) {
                    const status = response.status;
                    const statusText = response.statusText;
                    showResponse(
                        `<strong>TRANSMISSION SUCCESSFUL</strong><br>` +
                        `Status: ${status} ${statusText}<br>` +
                        `Timestamp: ${new Date().toISOString()}`,
                        'success'
                    );
                } else {
                    showResponse(
                        `<strong>TRANSMISSION FAILED</strong><br>` +
                        `Status: ${response.status} ${response.statusText}<br>` +
                        `The endpoint rejected the payload.`,
                        'error'
                    );
                }
            } catch (err) {
                showResponse(
                    `<strong>TRANSMISSION ERROR</strong><br>` +
                    `${err.message}<br>` +
                    `Check CORS policy or network connectivity.`,
                    'error'
                );
            } finally {
                sendBtn.disabled = false;
                sendBtn.innerHTML = originalText;
            }
        });

        // Keyboard shortcut
        document.addEventListener('keydown', (e) => {
            if (e.ctrlKey && e.key === 'Enter') {
                sendBtn.click();
            }
        });
    </script>
</body>
</html>
